services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # entrypoint: ["/bin/sh", "-lc"]
    # command: |
    #   ollama pull qwen3:1.7b
    #   ollama pull nomic-embed-text
    #   wait -n

  api:
    build: ./api
    env_file: ./api/.env
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  web:
    build: ./web
    env_file: ./web/.env
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  ollama:
